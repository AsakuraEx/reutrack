openapi: 3.0.0
info:
  title: Encargado API
  version: 1.0.0
tags:
  - Encargado

paths:
  /encargado/{id_reunion}:
    get:
      summary: Retrieve all Encargados for a specific meeting
      parameters:
        - name: id_reunion
          in: path
          required: true
          description: ID of the meeting to retrieve Encargados
          schema:
            type: integer
      responses:
        '200':
          description: A list of Encargados
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '../schemas/encargado.json'
    
  /encargado/create:  
    post:
      summary: Create a new Encargado
      tags:
        - Encargado
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../schemas/encargado.json'
      responses:
        '201':
          description: Encargado created
          content:
            application/json:
              schema:
                $ref: '../schemas/encargado.json'

  /encargado/delete/{id}:
    delete:
      summary: Delete an existing Encargado
      tags:
        - Encargado
      parameters:
        - name: id
          in: path
          required: true
          description: ID of the Encargado to delete
          schema:
            type: integer
      responses:
        '204':
          description: Encargado deleted
