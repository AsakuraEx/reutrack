openapi: 3.0.0
info:
  title: Lista de Asistencia API
  version: 1.0.0
tags:
  - Lista de Asistencia

paths:
  /listaasistencia/{id}:
    get:
      summary: Retrieve the attendance list for a specific meeting
      parameters:
        - name: id
          in: path
          required: true
          description: ID of the meeting to retrieve the attendance list
          schema:
            type: integer
      responses:
        '200':
          description: A list of attendance records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '../schemas/listaasistencia.json'
    post:
      summary: Create a new attendance list
      tags:
        - Lista de Asistencia
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../schemas/listaasistencia.json'
      responses:
        '201':
          description: Attendance list created
          content:
            application/json:
              schema:
                $ref: '../schemas/listaasistencia.json'

  /listaasistencia/delete/{id}:
    delete:
      summary: Delete an existing attendance list
      tags:
        - Lista de Asistencia
      parameters:
        - name: id
          in: path
          required: true
          description: ID of the attendance list to delete
          schema:
            type: integer
      responses:
        '204':
          description: Attendance list deleted
